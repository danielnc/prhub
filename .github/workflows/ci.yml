# Tests, lint, a packaged-install smoke test, and a secret scan on every pull request and push to main.
# The `ci` job at the end is the one stable check to require in branch protection: it passes only if every other
# job passed.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: cargo test
        run: cargo test --locked

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The oldest Rust that Cargo.toml's rust-version promises, read from the manifest so the two cannot drift.
      # The other jobs use the latest stable, so without this a dependency bump could quietly need a newer compiler.
      - name: Rust toolchain (rust-version from Cargo.toml)
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          test -n "$msrv"
          rustup toolchain install "$msrv" --profile minimal && rustup default "$msrv"
          rustc --version

      - name: cargo test
        run: cargo test --locked

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component llvm-tools-preview && rustup default stable

      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-llvm-cov

      # Coverage is gated here, and uploading it can never fail CI.
      - name: cargo llvm-cov
        run: cargo llvm-cov --locked --lcov --output-path lcov.info --fail-under-lines 85

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: false

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable

      - name: rustfmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Build the wheel and sdist
        run: uvx --from "maturin>=1.9,<2" maturin build --release --locked --sdist --out dist

      - name: Install the wheel in a clean venv and run the command
        # Run outside the checkout so the command can only come from the installed wheel.
        working-directory: ${{ runner.temp }}
        env:
          DIST: ${{ github.workspace }}/dist
          PRHUB_HOME: ${{ runner.temp }}/prhub-home
        run: |
          uv venv smoke
          uv pip install --python smoke/bin/python "$DIST"/*.whl
          smoke/bin/prhub --version
          smoke/bin/prhub --help
          smoke/bin/prhub wait --help
          # with no daemon, status must say so and exit 4
          set +e; smoke/bin/prhub status; code=$?; set -e
          test "$code" = 4

  binary:
    name: binary (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Release build
        run: cargo build --release --locked && target/release/prhub --version

      # A pull request's own build, to try it on a real machine before release.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prhub-macos
          path: target/release/prhub
          retention-days: 7
          if-no-files-found: error

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb # linux_x64 tarball
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the full history, every branch and tag
          persist-credentials: false

      - name: Install gitleaks (pinned release, checksum verified)
        working-directory: ${{ runner.temp }}
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum --check --strict
          tar -xzf "$tarball" gitleaks

      - name: Scan the full git history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose --log-opts="--all" --config .gitleaks.toml .'

  ci:
    name: ci
    if: always()
    needs: [test, msrv, coverage, lint, package, binary, gitleaks]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "::error::a required job did not succeed ($r)"
              exit 1
            fi
          done
