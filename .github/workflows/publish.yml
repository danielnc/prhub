# Publishes prhub when a v* tag is pushed: wheels and an sdist to PyPI (Trusted Publishing, OIDC: no API token in this
# repository), plus standalone binaries, the wheels, the sdist and their SLSA build provenance (prhub.intoto.jsonl) on
# the GitHub release for the tag. One-time setup and the release steps: docs/releasing.md.
name: Publish

on:
  push:
    tags: ["v*"]
  # A dry run: builds and smoke-tests every wheel and binary, publishes nothing.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check the version and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The tag matches the version in Cargo.toml
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match Cargo.toml version $version"
            exit 1
          fi

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable

      - name: Lint and test
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

  build:
    name: Build (${{ matrix.name }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { name: linux-aarch64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { name: macos-universal, os: macos-latest, target: universal2-apple-darwin }
          # Thin builds, half the size of the universal one: installers prefer them on their own architecture.
          - { name: macos-arm64, os: macos-latest, target: aarch64-apple-darwin }
          - { name: macos-x86_64, os: macos-latest, target: x86_64-apple-darwin, cross: true }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install stable --profile minimal && rustup default stable
          if [ "$TARGET" = universal2-apple-darwin ]; then
            rustup target add x86_64-apple-darwin aarch64-apple-darwin
          elif [ "$RUNNER_OS" = macOS ]; then
            rustup target add "$TARGET"
          fi

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: Build the wheel
        # Linux wheels target glibc 2.17 (manylinux2014) through zig, so they install on old distributions too.
        env:
          TARGET: ${{ matrix.target }}
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            uvx --from "maturin[zig]>=1.9,<2" maturin build --release --locked --zig --compatibility manylinux2014 --target "$TARGET" --out dist
          else
            uvx --from "maturin>=1.9,<2" maturin build --release --locked --target "$TARGET" --out dist
          fi

      - name: The standalone binary is the one in the wheel
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || 'dry-run' }}
          NAME: ${{ matrix.name }}
          CROSS: ${{ matrix.cross || false }}
        run: |
          mkdir -p bin stage
          unzip -o -j dist/*.whl '*.data/scripts/prhub' -d stage
          chmod +x stage/prhub
          if [ "$RUNNER_OS" = macOS ]; then lipo -archs stage/prhub; fi
          # an Intel build on an Apple Silicon runner runs only under Rosetta; without it, its architecture is the check
          if [ "$CROSS" != true ]; then
            stage/prhub --version
          elif arch -x86_64 /usr/bin/true 2>/dev/null; then
            arch -x86_64 stage/prhub --version
          else
            lipo -archs stage/prhub | grep -qx x86_64
          fi
          cp LICENSE README.md stage/
          tar -czf "bin/prhub-${TAG}-${NAME}.tar.gz" -C stage .

      - name: Smoke-test the wheel in a clean venv
        if: ${{ !matrix.cross }}
        working-directory: ${{ runner.temp }}
        env:
          DIST: ${{ github.workspace }}/dist
        run: |
          uv venv smoke
          uv pip install --python smoke/bin/python "$DIST"/*.whl
          smoke/bin/prhub --version

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ matrix.name }}
          path: |
            dist/
            bin/
          if-no-files-found: error

  sdist:
    name: Build the sdist
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: sdist
        run: uvx --from "maturin>=1.9,<2" maturin sdist --out dist

      # Its own artifact, downloaded into out/dist/ below: a single uploaded folder loses its name in the artifact.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist/
          if-no-files-found: error

  hashes:
    name: Hash everything for the provenance
    if: github.event_name == 'push'
    needs: [build, sdist]
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-*
          path: out
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdist
          path: out/dist

      - name: Hash
        id: hash
        working-directory: out
        run: echo "hashes=$( (cd dist && sha256sum -- *; cd ../bin && sha256sum -- *) | base64 -w0)" >> "$GITHUB_OUTPUT"

  provenance:
    name: SLSA provenance
    needs: hashes
    if: github.event_name == 'push'
    permissions:
      actions: read # read the workflow run that built the artifacts
      id-token: write # sign the provenance with Sigstore
      contents: write # attach prhub.intoto.jsonl to the GitHub release
    # The SLSA generator must be referenced by tag, not by commit SHA: its verifier checks the tag.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.hashes.outputs.hashes }}
      provenance-name: prhub.intoto.jsonl
      upload-assets: true

  release-assets:
    name: Attach the binaries, wheels and sdist to the GitHub release
    if: github.event_name == 'push'
    needs: [build, sdist, provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-*
          path: out
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdist
          path: out/dist

      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" out/dist/* out/bin/* --clobber --repo "$GITHUB_REPOSITORY"

  publish:
    name: Publish to PyPI
    if: github.event_name == 'push'
    # Only after the provenance and the release assets are on GitHub: a PyPI version must never exist without them.
    needs: [build, sdist, provenance, release-assets]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/prhub/
    permissions:
      id-token: write # Trusted Publishing: PyPI exchanges this OIDC token for a short-lived upload token
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-*
          path: out
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdist
          path: out/dist

      - name: Only wheels and the sdist go to PyPI
        run: mkdir dist && mv out/dist/* dist/ && ls dist

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
