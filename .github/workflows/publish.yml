# Publishes prhub to PyPI when a v* tag is pushed, using PyPI Trusted Publishing (OIDC): there is no API token in
# this repository. It also attaches the wheel, the sdist and their SLSA build provenance (prhub.intoto.jsonl) to the
# GitHub release for the tag. One-time setup and the release steps: docs/releasing.md.
name: Publish to PyPI

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Check, build, and smoke-test
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: The tag matches prhub.__version__
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 -c 'import prhub; print(prhub.__version__)')
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match prhub.__version__ $version"
            exit 1
          fi

      - name: Lint and test
        run: |
          uv sync --locked
          uv run ruff check .
          uv run pytest -q

      - name: Build
        run: uv build

      - name: Smoke-test the wheel in a clean venv
        # Run outside the checkout so the import can only come from the installed wheel.
        working-directory: ${{ runner.temp }}
        env:
          DIST: ${{ github.workspace }}/dist
        run: |
          uv venv smoke
          uv pip install --python smoke/bin/python "$DIST"/*.whl
          smoke/bin/prhub --version

      - name: Hash the wheel and sdist for the provenance
        id: hash
        working-directory: dist
        run: echo "hashes=$(sha256sum -- * | base64 -w0)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  provenance:
    name: SLSA provenance
    needs: build
    permissions:
      actions: read # read the workflow run that built the artifacts
      id-token: write # sign the provenance with Sigstore
      contents: write # attach prhub.intoto.jsonl to the GitHub release
    # The SLSA generator must be referenced by tag, not by commit SHA: its verifier checks the tag.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.build.outputs.hashes }}
      provenance-name: prhub.intoto.jsonl
      upload-assets: true

  release-assets:
    name: Attach the wheel and sdist to the GitHub release
    needs: [build, provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  publish:
    name: Publish to PyPI
    # Only after the provenance and the release assets are on GitHub: a PyPI version must never exist without them.
    needs: [build, provenance, release-assets]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/prhub/
    permissions:
      id-token: write # Trusted Publishing: PyPI exchanges this OIDC token for a short-lived upload token
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
