[package]
name = "prhub"
version = "0.2.1"
edition = "2021"
rust-version = "1.82"
description = "One GitHub poller for many coding agents: they wait on local PR, CI and deploy state instead of each polling the API"
license = "MIT"
repository = "https://github.com/danielnc/prhub"
homepage = "https://github.com/danielnc/prhub"
readme = "README.md"
keywords = ["github", "pull-requests", "ci", "rate-limit", "agents"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".github/", ".clusterfuzzlite/", "fuzz/", "docs/"]

[dependencies]
clap = { version = "4", features = ["derive"] }
libc = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = "2"

[lib]
name = "prhub"
path = "src/lib.rs"

[[bin]]
name = "prhub"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
