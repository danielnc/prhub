# prhub is a Rust program. This file only packages its binary for PyPI (maturin, `bindings = "bin"`), so
# `uv tool install prhub` and `pipx install prhub` keep working; the version comes from Cargo.toml.
[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "prhub"
dynamic = ["version"]
description = "One GitHub poller for many coding agents: they wait on local PR, CI and deploy state instead of each polling the API"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [{ name = "prhub contributors" }]
keywords = ["github", "pull-requests", "rate-limit", "ci", "deployments", "coding-agents", "claude-code", "codex", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.urls]
Homepage = "https://github.com/danielnc/prhub"
Documentation = "https://github.com/danielnc/prhub#readme"
Repository = "https://github.com/danielnc/prhub"
Issues = "https://github.com/danielnc/prhub/issues"
Changelog = "https://github.com/danielnc/prhub/blob/main/CHANGELOG.md"

[tool.maturin]
bindings = "bin"
strip = true
